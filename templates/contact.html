{% extends "base.html" %}
{% block title %}Contact - RentIt{% endblock %}
{% block content %}

<div class="row">
  <div class="col-md-6">
    <h2 class="mb-3">Contact Us</h2>
    <p class="text-secondary mb-4">Have a question about a booking or the fleet? Reach out.</p>

    <form class="auth-card ms-0">
      <div class="mb-3">
        <label class="form-label">Name</label>
        <input type="text" class="form-control" placeholder="Your name">
      </div>
      <div class="mb-3">
        <label class="form-label">Email</label>
        <input type="email" class="form-control" placeholder="you@example.com">
      </div>
      <div class="mb-3">
        <label class="form-label">Message</label>
        <textarea class="form-control" rows="4" placeholder="How can we help?"></textarea>
      </div>
      <button type="button" class="btn btn-brand w-100" disabled title="UI only - not wired to backend for this phase">Send Message</button>
    </form>
  </div>

  <div class="col-md-5 offset-md-1">
    <div class="feature-card mt-lg-5">
      <h5>Office</h5>
      <p class="text-secondary mb-3">Pune, Maharashtra, India</p>
      <h5>Email</h5>
      <p class="text-secondary mb-3">support@rentit.example</p>
      <h5>Hours</h5>
      <p class="text-secondary mb-0">Mon &ndash; Sat, 9am &ndash; 7pm</p>
    </div>
  </div>
</div>

{% endblock %}
